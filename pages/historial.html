<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Historial</title>

    <link rel="stylesheet"
          href="../css/app.css">
</head>

<body>

    <h1>Historial</h1>

    <div id="historialList">
    </div>

    <p>
        <a href="../index.html">
            Volver al inicio
        </a>
    </p>

    <script src="../js/database.js"></script>

    <script>

        async function cargarHistorial() {

            const tx =
                db.transaction(
                    "auditorias",
                    "readonly"
                );

            const store =
                tx.objectStore(
                    "auditorias"
                );

            const request =
                store.getAll();

            request.onsuccess =
                () => {

                    const lista =
                        document.getElementById(
                            "historialList"
                        );

                    request.result.forEach(
                        item => {

                            const div =
                                document.createElement(
                                    "div"
                                );

                            div.className =
                                "card";

                            div.innerHTML = `
                                <strong>${item.supervisor}</strong><br>
                                ${item.contratista}<br>
                                ${item.cuadrilla}<br>
                                ${item.usuarioSalesforce}
                            `;

                            lista.appendChild(
                                div
                            );

                        }
                    );

                };

        }

        initDB().then(
            () => {

                cargarHistorial();

            }
        );

    </script>

</body>

</html>
