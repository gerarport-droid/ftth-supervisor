<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Ficha de Cuadrilla</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Segoe UI,sans-serif;
        }

        body{
            background:#071426;
            color:white;
            padding:20px;
        }

        h1{
            margin-bottom:20px;
        }

        .card{

            background:#0d2342;

            border-left:5px solid #23d5ab;

            border-radius:12px;

            padding:20px;

            margin-bottom:15px;

        }

        .card h2{

            color:#23d5ab;

            margin-bottom:15px;

        }

        .dato{

            margin-bottom:8px;

        }

        .label{

            font-weight:bold;

            color:#23d5ab;

        }

        .estado{

            display:inline-block;

            background:#198754;

            color:white;

            padding:5px 12px;

            border-radius:20px;

            margin-top:10px;

        }

        .metricas{

            display:grid;

            grid-template-columns:
                repeat(auto-fit,minmax(180px,1fr));

            gap:15px;

            margin-top:20px;

        }

        .metrica{

            background:#11315f;

            padding:15px;

            border-radius:10px;

            text-align:center;

        }

        .metrica h3{

            font-size:28px;

            color:#23d5ab;

        }

        a{

            color:white;

            text-decoration:none;

        }

        .volver{

            margin-top:20px;

            display:inline-block;

        }

    </style>

</head>

    <h1>
        👥 Ficha Cuadrilla
    </h1>

        <h2>
            SPING23
        </h2>

            <span class="label">
                Contratista:
            </span>
            SP Ingeniería
