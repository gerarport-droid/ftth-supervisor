<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Estado Operacional</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Segoe UI,sans-serif;
}

body{
    background:#071426;
    color:white;
    padding:20px;
}

h1{
    margin-bottom:20px;
}

.resumen{

    display:grid;

    grid-template-columns:
    repeat(auto-fit,minmax(180px,1fr));

    gap:15px;

    margin-bottom:25px;

}

.card{

    background:#0d2342;

    border-left:5px solid #23d5ab;

    border-radius:12px;

    padding:20px;

}

.card h2{

    color:#23d5ab;

    font-size:30px;

}

.seccion{

    background:#0d2342;

    border-radius:12px;

    padding:20px;

    margin-bottom:20px;

}

.seccion h3{

    margin-bottom:15px;

    color:#23d5ab;

}

.estado-item{

    padding:10px;

    border-bottom:1px solid rgba(255,255,255,.1);

}

.estado-item:last-child{

    border-bottom:none;

}

.volver{

    display:inline-block;

    margin-top:15px;

    color:white;

    text-decoration:none;

}

</style>

</head>

<body>

<h1>
📍 Estado Operacional
</h1>

<p style="margin-bottom:20px;">
Fecha: 29/10/2026
</p>

<div class="resumen">

    <div class="card">

        <h2>22</h2>

        <p>🟢 Activas</p>

    </div>

    <div class="card">

        <h2>3</h2>

        <p>🔵 Backup</p>

    </div>

    <div class="card">

        <h2>2</h2>

        <p>⚪ Libres</p>

    </div>

    <div class="card">

        <h2>1</h2>

        <p>🟡 Vacaciones</p>

    </div>

</div>

<div class="seccion">

    <h3>
        🟢 Cuadrillas Activas
    </h3>

    <div class="estado-item">
        SPING01
    </div>

    <div class="estado-item">
        SPING04
    </div>

    <div class="estado-item">
        SPING23
    </div>

</div>

<div class="seccion">

    <h3>
        🔵 Cuadrillas Backup
    </h3>

    <div class="estado-item">
        SPING07
    </div>

    <div class="estado-item">
        SPING12
    </div>

</div>

<div class="seccion">

    <h3>
        ⚪ Cuadrillas Libres
    </h3>

    <div class="estado-item">
        SPING15
    </div>

</div>

<div class="seccion">

    <h3>
        🟡 Vacaciones
    </h3>

    <div class="estado-item">
        SPING09
    </div>

</div>

<a
href="../index.html"
class="volver">

⬅ Volver al Dashboard

</a>

</body>

</html>
